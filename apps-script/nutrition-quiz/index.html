<!DOCTYPE html>
<html lang="ko">
<head>
  <base target="_top">
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="preconnect" href="https://minj0475-coder.github.io" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Jua&family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --paper: #FAF6F3;
      --surface: #FFFFFF;
      --surface-2: #F6F1ED;
      --ink: #382F35;
      --ink-2: #6E6068;
      --ink-3: #7B6A73;
      --line: #EDE4DF;
      --rose: #E0788F;
      --rose-ink: #D33F60;
      --rose-soft: #FCEEF2;
      --sage: #4E9E86;
      --sage-ink: #3C7A68;
      --sage-soft: #EBF5F1;
      --clay: #C27268;
      --clay-ink: #AE5246;
      --clay-soft: #FAEEEC;
      --display: 'Jua', 'Apple SD Gothic Neo', sans-serif;
      --text: 'Noto Sans KR', 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif;
      --shadow: 0 1px 1px rgba(56, 47, 53, 0.03), 0 8px 18px -10px rgba(56, 47, 53, 0.16), 0 26px 46px -22px rgba(56, 47, 53, 0.22);
    }

    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

    body {
      margin: 0;
      padding: 28px 18px 56px;
      font-family: var(--text);
      color: var(--ink);
      background:
        radial-gradient(ellipse 70% 40% at 84% -2%, rgba(224, 120, 143, 0.09), transparent 70%),
        linear-gradient(180deg, #FDFAF8 0%, var(--paper) 46%, #F6F1ED 100%);
      background-attachment: fixed;
      min-height: 100vh;
      line-height: 1.62;
      word-break: keep-all;
      overflow-wrap: break-word;
      -webkit-font-smoothing: antialiased;
    }

    .app-shell { max-width: 520px; margin: 0 auto; }
    .hidden { display: none !important; }

    /* ---------- header ---------- */
    .hero { text-align: center; margin-bottom: 18px; }

    .hero h1 {
      font-family: var(--display);
      font-size: 27px;
      font-weight: 400;
      margin: 0;
      color: var(--ink);
      letter-spacing: -0.6px;
    }

    .hero p {
      margin: 3px 0 0;
      font-size: 13px;
      color: var(--ink-3);
      letter-spacing: 0;
    }

    /* ---------- surfaces ---------- */
    .surface {
      position: relative;
      overflow: hidden;
      background: var(--surface);
      border: 1px solid rgba(56, 47, 53, 0.045);
      border-radius: 24px;
      padding: 30px 24px 28px;
      box-shadow: var(--shadow);
      animation: rise 0.5s cubic-bezier(0.22, 0.8, 0.3, 1) both;
    }

    @keyframes rise {
      from { opacity: 0; transform: translateY(12px); }
      to { opacity: 1; transform: none; }
    }

    /* ---------- mascot ---------- */
    .mascot-stage {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 4px;
      margin-bottom: 20px;
      min-height: 106px;
    }

    .mascot {
      width: 98px;
      height: auto;
      display: block;
      flex: none;
      filter: drop-shadow(0 10px 14px rgba(224, 120, 143, 0.16));
      animation: bob 4.5s ease-in-out infinite;
    }

    .mascot.is-react { animation: cheer 0.7s cubic-bezier(0.22, 1.2, 0.36, 1); }

    @keyframes bob {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-5px); }
    }

    @keyframes cheer {
      0% { transform: scale(0.88) rotate(-3deg); }
      50% { transform: scale(1.06) rotate(2deg); }
      100% { transform: scale(1) rotate(0); }
    }

    .bubble {
      position: relative;
      background: var(--rose-soft);
      border-radius: 16px;
      padding: 11px 15px;
      font-size: 14.5px;
      font-weight: 500;
      color: var(--ink-2);
      max-width: 178px;
      letter-spacing: -0.2px;
      box-shadow: 0 4px 12px -4px rgba(224, 120, 143, 0.28);
      animation: rise 0.34s ease both;
    }

    .bubble::before {
      content: "";
      position: absolute;
      left: -5px;
      top: 50%;
      width: 12px;
      height: 12px;
      margin-top: -6px;
      border-radius: 3px;
      background: inherit;
      transform: rotate(45deg);
    }

    .bubble.is-correct { background: var(--sage-soft); color: var(--sage-ink); }
    .bubble.is-wrong { background: var(--clay-soft); color: var(--clay-ink); }

    /* ---------- tabs ---------- */
    .segmented {
      display: flex;
      gap: 4px;
      background: var(--surface-2);
      border-radius: 999px;
      padding: 4px;
      margin-bottom: 22px;
    }

    .tab-btn {
      flex: 1;
      border: none;
      background: transparent;
      border-radius: 999px;
      padding: 11px 8px;
      font-family: var(--text);
      font-size: 15px;
      font-weight: 500;
      color: var(--ink-3);
      cursor: pointer;
      transition: background 0.28s cubic-bezier(0.22, 0.8, 0.3, 1), color 0.28s ease, box-shadow 0.28s ease;
    }

    .tab-btn.active {
      background: var(--surface);
      color: var(--ink);
      box-shadow: 0 2px 7px -1px rgba(56, 47, 53, 0.14);
    }

    /* ---------- form ---------- */
    .field-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
    .input-group.full { grid-column: 1 / -1; }

    .input-group label {
      display: block;
      font-size: 12.5px;
      font-weight: 500;
      color: var(--ink-3);
      margin-bottom: 7px;
      letter-spacing: 0.2px;
    }

    .input-group input,
    .input-group select {
      width: 100%;
      border: 1.5px solid var(--line);
      background: var(--surface);
      border-radius: 14px;
      padding: 14px 15px;
      font-size: 17px;
      font-family: var(--text);
      color: var(--ink);
      outline: none;
      transition: border-color 0.22s ease, box-shadow 0.22s ease;
    }

    .input-group input:focus,
    .input-group select:focus {
      border-color: var(--rose);
      box-shadow: 0 0 0 3.5px var(--rose-soft);
    }

    .input-group input::placeholder { color: #8E7D86; }

    .input-group select {
      appearance: none;
      -webkit-appearance: none;
      background-image: url("data:image/svg+xml;charset=utf-8,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%237B6A73' stroke-width='2.4' stroke-linecap='round' stroke-linejoin='round'%3E%3Cpath d='m6 9 6 6 6-6'/%3E%3C/svg%3E");
      background-repeat: no-repeat;
      background-position: right 17px center;
      background-size: 18px;
      padding-right: 48px;
    }

    /* ---------- buttons ---------- */
    .primary-btn {
      width: 100%;
      margin-top: 24px;
      border: none;
      border-radius: 16px;
      padding: 17px;
      font-family: var(--text);
      font-size: 17px;
      font-weight: 700;
      letter-spacing: -0.2px;
      color: #fff;
      background: linear-gradient(180deg, #E1546F 0%, var(--rose-ink) 100%);
      box-shadow: 0 12px 22px -12px rgba(211, 63, 96, 0.55), inset 0 1px 0 rgba(255, 255, 255, 0.16);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 7px;
      min-height: 58px;
      transition: transform 0.16s ease, background 0.22s ease, box-shadow 0.22s ease;
    }

    .primary-btn:active:not(:disabled) { transform: scale(0.985); background: #BC3854; box-shadow: 0 6px 14px -10px rgba(211, 63, 96, 0.5); }
    .primary-btn:disabled { background: var(--surface-2); color: var(--ink-3); box-shadow: none; cursor: default; }
    .primary-btn svg { width: 19px; height: 19px; }

    @media (hover: hover) {
      .primary-btn:not(:disabled):hover { transform: translateY(-1px); box-shadow: 0 16px 26px -12px rgba(211, 63, 96, 0.6), inset 0 1px 0 rgba(255, 255, 255, 0.16); }
      .secondary-btn:hover { background: var(--surface-2); border-color: #E4D7D1; }
      .opt-btn:not(:disabled):hover { border-color: var(--rose); background: var(--rose-soft); }
    }

    .secondary-btn {
      width: 100%;
      margin-top: 18px;
      border: 1.5px solid var(--line);
      border-radius: 16px;
      padding: 15px;
      font-family: var(--text);
      font-size: 15px;
      font-weight: 500;
      color: var(--ink-2);
      background: var(--surface);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 7px;
      min-height: 52px;
      transition: transform 0.16s ease, background 0.22s ease;
    }

    .secondary-btn:active { transform: scale(0.985); background: var(--surface-2); }
    .secondary-btn svg { width: 17px; height: 17px; }

    .status-note {
      text-align: center;
      margin: 14px 0 0;
      font-size: 13px;
      color: var(--ink-3);
    }

    /* ---------- quiz ---------- */
    .card-progress {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 3px;
      background: var(--surface-2);
    }

    .progress-bar {
      height: 100%;
      width: 0;
      background: var(--rose-ink);
      transition: width 0.55s cubic-bezier(0.22, 0.8, 0.3, 1);
    }

    .card-progress.is-complete .progress-bar { width: 100%; background: var(--sage-ink); }

    .quiz-top { margin-bottom: 12px; }

    .progress-badge {
      font-size: 12.5px;
      font-weight: 500;
      color: var(--ink-3);
      letter-spacing: 0.8px;
    }

    .question {
      font-family: var(--text);
      font-size: 21px;
      font-weight: 500;
      line-height: 1.66;
      letter-spacing: -0.4px;
      margin: 0 0 20px;
      color: var(--ink);
    }

    .options { display: flex; flex-direction: column; gap: 10px; }

    .opt-btn {
      display: flex;
      align-items: center;
      gap: 13px;
      width: 100%;
      min-height: 68px;
      text-align: left;
      border: 1.5px solid var(--line);
      background: var(--surface);
      border-radius: 16px;
      padding: 14px 16px;
      font-size: 16px;
      font-family: var(--text);
      color: var(--ink);
      line-height: 1.5;
      letter-spacing: -0.2px;
      cursor: pointer;
      box-shadow: 0 2px 6px -4px rgba(56, 47, 53, 0.08);
      transition: transform 0.16s ease, border-color 0.24s ease, background 0.24s ease, opacity 0.3s ease, box-shadow 0.24s ease;
    }

    .opt-btn:active:not(:disabled) { transform: scale(0.99); background: var(--surface-2); }
    .opt-btn:disabled { cursor: default; }

    .option-number {
      flex: none;
      width: 28px;
      height: 28px;
      border-radius: 9px;
      display: grid;
      place-items: center;
      font-size: 13px;
      font-weight: 700;
      color: var(--ink-3);
      background: var(--surface-2);
      transition: background 0.24s ease, color 0.24s ease;
    }

    .opt-btn.is-correct {
      border-color: var(--sage);
      background: var(--sage-soft);
      box-shadow: 0 4px 14px -8px rgba(78, 158, 134, 0.4);
      animation: cheer 0.56s cubic-bezier(0.22, 1.2, 0.36, 1);
    }

    .opt-btn.is-correct .option-number { background: var(--sage-ink); color: #fff; }

    .opt-btn.is-picked-wrong {
      border-color: #E8C4BF;
      background: var(--clay-soft);
      box-shadow: 0 4px 14px -8px rgba(174, 82, 70, 0.3);
    }

    .opt-btn.is-picked-wrong .option-number { background: var(--clay-ink); color: #fff; }
    .opt-btn.is-dimmed { opacity: 0.55; }

    /* ---------- result ---------- */
    .result-hero { text-align: center; }

    .result-complete-label {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      font-size: 13px;
      font-weight: 500;
      color: var(--sage-ink);
      background: var(--sage-soft);
      border-radius: 999px;
      padding: 6px 14px 6px 6px;
    }

    .result-complete-icon {
      width: 28px;
      height: 28px;
      border-radius: 50%;
      background: var(--sage-ink);
      display: grid;
      place-items: center;
      color: #fff;
    }

    .result-complete-icon svg { width: 16px; height: 16px; }

    .result-title {
      font-family: var(--display);
      font-size: 24px;
      font-weight: 400;
      margin: 16px 0 3px;
      color: var(--ink);
      letter-spacing: -0.3px;
    }

    .user-info { margin: 0; font-size: 13px; color: var(--ink-3); }

    .score-card {
      margin: 22px auto 0;
      padding: 18px 10px 16px;
      border-radius: 20px;
      background: linear-gradient(180deg, var(--rose-soft) 0%, rgba(252, 238, 242, 0.35) 100%);
    }

    .score-card-label {
      display: block;
      font-size: 12.5px;
      font-weight: 500;
      letter-spacing: 0.4px;
      color: var(--ink-3);
    }

    .score-card-value {
      display: flex;
      align-items: baseline;
      justify-content: center;
      gap: 2px;
      font-family: var(--display);
      color: var(--ink);
      font-size: 21px;
      margin-top: 2px;
    }

    .score-card-value strong {
      font-size: 56px;
      font-weight: 400;
      line-height: 1.05;
      color: var(--rose-ink);
      letter-spacing: -1px;
    }

    .score-card-value span { color: var(--ink-3); }

    .result-message { margin-top: 18px; }

    .score-display {
      display: block;
      font-size: 12.5px;
      font-weight: 500;
      color: var(--ink-3);
      letter-spacing: 0.2px;
    }

    .score-message {
      display: block;
      margin-top: 6px;
      font-size: 15px;
      font-weight: 500;
      color: var(--ink);
      letter-spacing: -0.2px;
    }

    .score-progress {
      height: 4px;
      border-radius: 999px;
      background: var(--surface-2);
      overflow: hidden;
      margin-top: 18px;
    }

    .score-progress-bar {
      height: 100%;
      width: 0;
      border-radius: 999px;
      background: linear-gradient(90deg, var(--rose-ink), var(--sage-ink));
      transition: width 0.9s cubic-bezier(0.22, 0.8, 0.3, 1);
    }

    .result-list-head {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 10px;
      margin: 34px 0 14px;
      padding-top: 26px;
      border-top: 1px solid var(--line);
    }

    .result-list-head h3 {
      font-family: var(--display);
      font-size: 17px;
      font-weight: 400;
      margin: 0;
      color: var(--ink);
    }

    .result-list-head span { font-size: 12.5px; color: var(--ink-3); }

    .result-details { display: flex; flex-direction: column; gap: 12px; }

    .result-item {
      border: 1.5px solid var(--line);
      border-radius: 18px;
      padding: 18px;
      background: var(--surface);
      box-shadow: 0 3px 10px -6px rgba(56, 47, 53, 0.1);
    }

    .result-item.is-correct { border-color: #D7EBE3; }
    .result-item.is-wrong { border-color: #EFDAD6; }

    .result-item-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      margin-bottom: 10px;
    }

    .result-number {
      font-size: 12.5px;
      font-weight: 500;
      letter-spacing: 0.4px;
      color: var(--ink-3);
    }

    .result-chip {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      font-size: 12.5px;
      font-weight: 500;
      border-radius: 999px;
      padding: 4px 11px;
    }

    .result-chip svg { width: 14px; height: 14px; }
    .result-chip.correct { background: var(--sage-soft); color: var(--sage-ink); }
    .result-chip.wrong { background: var(--clay-soft); color: var(--clay-ink); }

    .result-question {
      font-family: var(--text);
      font-size: 16px;
      font-weight: 500;
      line-height: 1.62;
      margin: 0 0 14px;
      color: var(--ink);
      letter-spacing: -0.3px;
    }

    .answer-summary { display: flex; flex-direction: column; gap: 7px; }

    .answer-row {
      border-radius: 13px;
      padding: 11px 13px;
      background: var(--surface-2);
    }

    .answer-row.is-correct { background: var(--sage-soft); }
    .answer-row.is-wrong { background: var(--clay-soft); }

    .answer-label {
      display: block;
      font-size: 12px;
      font-weight: 500;
      letter-spacing: 0.3px;
      color: var(--ink-3);
      margin-bottom: 4px;
    }

    .answer-row strong {
      display: flex;
      align-items: center;
      gap: 8px;
      font-weight: 400;
      font-size: 15px;
      line-height: 1.45;
    }

    .answer-number {
      flex: none;
      width: 22px;
      height: 22px;
      border-radius: 50%;
      display: grid;
      place-items: center;
      font-style: normal;
      font-size: 12px;
      font-weight: 700;
      background: var(--surface);
      color: var(--ink-3);
    }

    .answer-row.is-correct .answer-number { background: var(--sage-ink); color: #fff; }
    .answer-row.is-wrong .answer-number { background: var(--clay-ink); color: #fff; }

    .explain {
      display: flex;
      gap: 10px;
      margin-top: 14px;
      padding-top: 14px;
      border-top: 1px solid var(--line);
      font-size: 14px;
      line-height: 1.6;
      color: var(--ink-2);
    }

    .explain-icon { flex: none; color: var(--rose-ink); margin-top: 1px; }
    .explain-icon svg { width: 17px; height: 17px; }

    .explain strong {
      display: block;
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 0.4px;
      color: var(--rose-ink);
      margin-bottom: 2px;
    }

    .result-actions { margin-top: 26px; }

    .timer-notice {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      font-size: 13px;
      color: var(--ink-3);
    }

    .timer-notice svg { width: 15px; height: 15px; }

    /* ---------- confetti (perfect score only) ---------- */
    .confetti { position: fixed; inset: 0; pointer-events: none; overflow: hidden; z-index: 5; }

    .confetti i {
      position: absolute;
      top: -14px;
      width: 7px;
      height: 11px;
      border-radius: 1.5px;
      opacity: 0;
      animation: fall 2.8s cubic-bezier(0.3, 0.1, 0.5, 1) forwards;
    }

    @keyframes fall {
      0% { opacity: 0.95; transform: translateY(0) rotate(0); }
      100% { opacity: 0; transform: translateY(105vh) rotate(480deg); }
    }

    /* ---------- responsive ---------- */
    @media (min-width: 620px) {
      body { padding-top: 46px; }
      .app-shell { max-width: 580px; }
      .hero h1 { font-size: 34px; }
      .surface { padding: 36px 34px; }
      .mascot { width: 122px; }
      .mascot-stage { min-height: 130px; }
      .question { font-size: 23px; }
      .opt-btn { font-size: 17px; min-height: 72px; }
    }

    @media (max-width: 360px) {
      body { padding: 22px 14px 44px; }
      .hero h1 { font-size: 25px; }
      .surface { padding: 24px 18px; }
      .question { font-size: 19px; }
      .opt-btn { font-size: 15px; }
      .mascot { width: 88px; }
      .mascot-stage { min-height: 96px; }
      .bubble { font-size: 13.5px; max-width: 158px; }
      .score-card-value strong { font-size: 48px; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, .mascot, .surface, .bubble { animation: none !important; transition: none !important; }
    }
  </style>
</head>
<body>
  <main class="app-shell">
    <header class="hero">
      <h1>오늘의 영양 퀴즈</h1>
      <p>꿀꿀이와 함께 오늘의 영양 이야기를 풀어 봐요</p>
    </header>

    <section id="user-screen" class="surface">
      <div class="mascot-stage">
        <img id="start-mascot" class="mascot" alt="별 요술봉을 든 꿀꿀이"
             src="https://minj0475-coder.github.io/kknutrition/assets/images/kkul-display/kkul_41.webp">
        <div class="bubble">안녕! 오늘도 같이 풀어 볼까?</div>
      </div>

      <div class="segmented" role="tablist" aria-label="참여 유형">
        <button type="button" class="tab-btn active" id="tab-student" role="tab" aria-selected="true" onclick="switchUserType('student')">학생</button>
        <button type="button" class="tab-btn" id="tab-staff" role="tab" aria-selected="false" onclick="switchUserType('staff')">교직원</button>
      </div>

      <div id="form-student" class="field-grid">
        <div class="input-group full">
          <label for="grade">학년</label>
          <select id="grade">
            <option value="1">1학년</option><option value="2">2학년</option>
            <option value="3">3학년</option><option value="4">4학년</option>
            <option value="5">5학년</option><option value="6">6학년</option>
          </select>
        </div>
        <div class="input-group">
          <label for="class-num">반</label>
          <input type="number" id="class-num" min="1" inputmode="numeric" placeholder="예: 1">
        </div>
        <div class="input-group">
          <label for="student-num">번호</label>
          <input type="number" id="student-num" min="1" inputmode="numeric" placeholder="예: 15">
        </div>
      </div>

      <div id="form-staff" class="hidden">
        <div class="input-group">
          <label for="staff-dept">부서</label>
          <input type="text" id="staff-dept" autocomplete="organization" placeholder="예: 3학년부">
        </div>
      </div>

      <button id="start-btn" class="primary-btn" type="button" onclick="startQuiz()" disabled>
        <span id="start-btn-text">퀴즈 불러오는 중…</span>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14"></path><path d="m13 6 6 6-6 6"></path></svg>
      </button>
      <p id="load-message" class="status-note" aria-live="polite">오늘의 문제를 준비하고 있어요.</p>
    </section>

    <section id="quiz-screen" class="surface hidden">
      <div class="card-progress" aria-hidden="true"><div class="progress-bar" id="progress-bar"></div></div>

      <div class="mascot-stage">
        <img id="helper-mascot" class="mascot" alt="함께 문제를 푸는 꿀꿀이"
             src="https://minj0475-coder.github.io/kknutrition/assets/images/kkul-display/kkul_62.webp">
        <div class="bubble" id="helper-say">천천히 생각해 봐!</div>
      </div>

      <div class="quiz-top">
        <span class="progress-badge" id="quiz-progress">문제 1 / 3</span>
      </div>
      <h2 id="quiz-question" class="question">질문이 여기에 표시됩니다.</h2>
      <div id="quiz-options" class="options"></div>
    </section>

    <section id="result-screen" class="surface hidden">
      <div class="card-progress is-complete" aria-hidden="true"><div class="progress-bar"></div></div>

      <div class="result-hero">
        <div class="mascot-stage">
          <img id="result-mascot" class="mascot" alt="결과를 알려 주는 꿀꿀이"
               src="https://minj0475-coder.github.io/kknutrition/assets/images/kkul-display/kkul_31.webp">
        </div>

        <div class="result-complete-label">
          <span class="result-complete-icon" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"><path d="m7 12 3 3 7-7"></path></svg></span>
          <span>오늘의 학습 완료</span>
        </div>

        <h2 class="result-title">수고했어요!</h2>
        <p id="user-info-display" class="user-info"></p>

        <div class="score-card" id="score-orb" role="img" aria-label="퀴즈 점수">
          <span class="score-card-label">맞힌 문제</span>
          <div class="score-card-value"><strong id="score-value">0</strong><span>/</span><span id="score-total">0</span></div>
        </div>

        <div class="result-message">
          <strong id="score-display" class="score-display"></strong>
          <span id="score-message" class="score-message"></span>
          <div class="score-progress" aria-hidden="true"><div id="score-progress-bar" class="score-progress-bar"></div></div>
        </div>
      </div>

      <div class="result-list-head"><h3>문제별 풀이</h3><span>정답과 해설을 확인해 보세요</span></div>
      <div id="result-details" class="result-details"></div>

      <div class="result-actions">
        <div class="timer-notice" id="timer-text" aria-live="polite">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"></circle><path d="M12 7v5l3 2"></path></svg>
          <span>결과를 안전하게 저장하고 있어요.</span>
        </div>
        <button class="secondary-btn" type="button" onclick="resetApp()">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m9 14-4-4 4-4"></path><path d="M5 10h9a5 5 0 0 1 5 5v1"></path></svg>
          처음 화면으로 돌아가기
        </button>
      </div>
    </section>
  </main>

  <script>
    const KKUL = 'https://minj0475-coder.github.io/kknutrition/assets/images/kkul-display/';
    const HELPER_IDLE = ['kkul_62.webp', 'kkul_58.webp', 'kkul_20.webp'];
    const HELPER_LINES = ['천천히 생각해 봐!', '이건 어떨까?', '조금만 더 힘내!'];
    const CORRECT_LINES = ['딩동댕! 정답이야', '우와, 잘했어!', '역시 대단해!'];
    const WRONG_LINES = ['괜찮아, 같이 알아 두자', '아쉬워! 다음엔 맞힐 거야', '이건 조금 어려웠지?'];
    const RESULT_IMAGES = ['kkul_31.webp', 'kkul_29.webp', 'kkul_57.webp'];
    const CORRECT_IMAGE = 'kkul_27.webp';
    const WRONG_IMAGE = 'kkul_56.webp';

    const preloadedImages = [];
    function preloadMascotImages() {
      const files = HELPER_IDLE.concat(RESULT_IMAGES, [CORRECT_IMAGE, WRONG_IMAGE]);
      files.forEach(function(file) {
        const img = new Image();
        img.src = KKUL + file;
        preloadedImages.push(img);
      });
    }
    preloadMascotImages();

    let userType = 'student';
    let quizzes = [];
    let currentIdx = 0;
    let userAnswers = [];
    let userInfoText = '';
    let autoResetTimer = null;
    let countdownInterval = null;
    let advanceTimer = null;
    let quizLoadState = 'loading';
    let answerLocked = false;

    function setLoadState(state) {
      const startBtn = document.getElementById('start-btn');
      const startText = document.getElementById('start-btn-text');
      const message = document.getElementById('load-message');
      quizLoadState = state;
      message.classList.toggle('hidden', state === 'ready');

      if (state === 'ready') {
        startBtn.disabled = false;
        startText.textContent = '퀴즈 시작하기';
        message.textContent = '';
      } else if (state === 'empty') {
        startBtn.disabled = true;
        startText.textContent = '오늘의 퀴즈 준비 중';
        message.textContent = '문제를 준비하지 못했어요. 잠시 후 새로고침해 주세요.';
      } else if (state === 'error') {
        startBtn.disabled = true;
        startText.textContent = '다시 불러와 주세요';
        message.textContent = '문제를 불러오지 못했어요. 잠시 후 새로고침해 주세요.';
      } else {
        startBtn.disabled = true;
        startText.textContent = '퀴즈 불러오는 중…';
        message.textContent = '오늘의 문제를 준비하고 있어요.';
      }
    }

    function loadQuizzes() {
      setLoadState('loading');
      google.script.run
        .withSuccessHandler(function(data) {
          quizzes = Array.isArray(data) ? data : [];
          setLoadState(quizzes.length ? 'ready' : 'empty');
        })
        .withFailureHandler(function() {
          quizzes = [];
          setLoadState('error');
        })
        .getTodayQuizzes();
    }
    loadQuizzes();

    function switchUserType(type) {
      userType = type;
      const isStudent = type === 'student';
      document.getElementById('tab-student').classList.toggle('active', isStudent);
      document.getElementById('tab-staff').classList.toggle('active', !isStudent);
      document.getElementById('tab-student').setAttribute('aria-selected', String(isStudent));
      document.getElementById('tab-staff').setAttribute('aria-selected', String(!isStudent));
      document.getElementById('form-student').classList.toggle('hidden', !isStudent);
      document.getElementById('form-staff').classList.toggle('hidden', isStudent);
    }

    function setHelper(image, line, react, tone) {
      const mascot = document.getElementById('helper-mascot');
      const bubble = document.getElementById('helper-say');
      mascot.src = KKUL + image;
      bubble.textContent = line;
      bubble.className = 'bubble' + (tone ? ' ' + tone : '');
      if (react) {
        mascot.classList.remove('is-react');
        void mascot.offsetWidth;
        mascot.classList.add('is-react');
      }
    }

    function pick(list, index) {
      return list[index % list.length];
    }

    function startQuiz() {
      if (quizLoadState === 'loading') {
        alert('오늘의 퀴즈를 불러오는 중이에요. 잠시만 기다려 주세요.');
        return;
      }
      if (!quizzes || quizzes.length === 0) {
        alert('오늘의 퀴즈를 준비하지 못했어요. 잠시 후 새로고침해 주세요.');
        return;
      }

      if (userType === 'student') {
        const grade = document.getElementById('grade').value;
        const classNum = document.getElementById('class-num').value;
        const num = document.getElementById('student-num').value;
        if (!classNum || !num) {
          alert('반과 번호를 입력해 주세요.');
          return;
        }
        userInfoText = grade + '학년 ' + classNum + '반 ' + num + '번';
      } else {
        const dept = document.getElementById('staff-dept').value.trim();
        if (!dept) {
          alert('부서를 입력해 주세요.');
          return;
        }
        userInfoText = '교직원 [' + dept + ']';
      }

      currentIdx = 0;
      userAnswers = [];
      document.getElementById('user-screen').classList.add('hidden');
      document.getElementById('quiz-screen').classList.remove('hidden');
      showQuestion();
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    function showQuestion() {
      answerLocked = false;
      const q = quizzes[currentIdx];
      document.getElementById('quiz-progress').textContent = '문제 ' + (currentIdx + 1) + ' / ' + quizzes.length;
      document.getElementById('progress-bar').style.width = (((currentIdx + 1) / quizzes.length) * 100) + '%';
      document.getElementById('quiz-question').textContent = q.question;
      setHelper(pick(HELPER_IDLE, currentIdx), pick(HELPER_LINES, currentIdx), false, '');

      const optsDiv = document.getElementById('quiz-options');
      optsDiv.innerHTML = q.options.map(function(opt, i) {
        return '<button class="opt-btn" type="button" data-option="' + (i + 1) + '" onclick="selectAnswer(' + (i + 1) + ')">' +
          '<span class="option-number">' + (i + 1) + '</span>' +
          '<span>' + escapeHtml(opt) + '</span></button>';
      }).join('');
    }

    function selectAnswer(selectedOption) {
      if (answerLocked) return;
      answerLocked = true;
      userAnswers.push(selectedOption);

      const q = quizzes[currentIdx];
      const isCorrect = selectedOption === q.answer;
      const buttons = document.querySelectorAll('#quiz-options .opt-btn');

      buttons.forEach(function(button) {
        const option = Number(button.getAttribute('data-option'));
        button.disabled = true;
        if (option === q.answer) {
          button.classList.add('is-correct');
        } else if (option === selectedOption) {
          button.classList.add('is-picked-wrong');
        } else {
          button.classList.add('is-dimmed');
        }
      });

      if (isCorrect) {
        setHelper(CORRECT_IMAGE, pick(CORRECT_LINES, currentIdx), true, 'is-correct');
      } else {
        setHelper(WRONG_IMAGE, pick(WRONG_LINES, currentIdx), true, 'is-wrong');
      }

      if (advanceTimer) clearTimeout(advanceTimer);
      advanceTimer = setTimeout(function() {
        currentIdx++;
        if (currentIdx < quizzes.length) {
          showQuestion();
        } else {
          showResults();
        }
      }, 2200);
    }

    function dropConfetti() {
      const colors = ['#E0788F', '#4E9E86', '#E8B86D', '#9BB7D4', '#C9A7CE'];
      const layer = document.createElement('div');
      layer.className = 'confetti';
      let pieces = '';
      for (let i = 0; i < 30; i++) {
        pieces += '<i style="left:' + Math.random() * 100 + '%;background:' + colors[i % colors.length] +
          ';animation-delay:' + (Math.random() * 1.1).toFixed(2) + 's"></i>';
      }
      layer.innerHTML = pieces;
      document.body.appendChild(layer);
      setTimeout(function() { layer.remove(); }, 4200);
    }

    function showResults() {
      document.getElementById('quiz-screen').classList.add('hidden');
      document.getElementById('result-screen').classList.remove('hidden');
      document.getElementById('user-info-display').textContent = userInfoText;

      let correctCount = 0;
      const detailsDiv = document.getElementById('result-details');
      const answersTextArr = [];

      detailsDiv.innerHTML = quizzes.map(function(q, idx) {
        const isCorrect = userAnswers[idx] === q.answer;
        const selectedAnswer = q.options[userAnswers[idx] - 1] || '';
        const correctAnswer = q.options[q.answer - 1] || '';
        if (isCorrect) correctCount++;
        answersTextArr.push('Q' + (idx + 1) + ':' + userAnswers[idx] + '번');
        const statusIcon = isCorrect
          ? '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m7 12 3 3 7-7"></path><circle cx="12" cy="12" r="9"></circle></svg>'
          : '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"></circle><path d="m9 9 6 6M15 9l-6 6"></path></svg>';
        const answerRows = isCorrect
          ? '<div class="answer-row is-correct"><span class="answer-label">내가 고른 답 · 정답</span><strong><i class="answer-number">' + q.answer + '</i>' + escapeHtml(correctAnswer) + '</strong></div>'
          : '<div class="answer-row is-wrong"><span class="answer-label">내가 고른 답</span><strong><i class="answer-number">' + userAnswers[idx] + '</i>' + escapeHtml(selectedAnswer) + '</strong></div>' +
            '<div class="answer-row is-correct"><span class="answer-label">정답</span><strong><i class="answer-number">' + q.answer + '</i>' + escapeHtml(correctAnswer) + '</strong></div>';
        return '<article class="result-item ' + (isCorrect ? 'is-correct' : 'is-wrong') + '">' +
          '<div class="result-item-head"><span class="result-number">문제 ' + (idx + 1) + '</span>' +
          '<span class="result-chip ' + (isCorrect ? 'correct' : 'wrong') + '">' + statusIcon + (isCorrect ? '정답' : '오답 확인') + '</span></div>' +
          '<h3 class="result-question">' + escapeHtml(q.question) + '</h3>' +
          '<div class="answer-summary">' + answerRows + '</div>' +
          '<div class="explain"><span class="explain-icon" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18h6"></path><path d="M10 22h4"></path><path d="M8.5 14.5A6 6 0 1 1 15.5 14.5C14.5 15.3 14 16 14 17h-4c0-1-.5-1.7-1.5-2.5Z"></path></svg></span><span><strong>영양 포인트</strong>' + escapeHtml(q.explain) + '</span></div>' +
          '</article>';
      }).join('');

      const isPerfect = correctCount === quizzes.length;
      const scoreMessage = isPerfect
        ? '멋져요! 오늘 문제를 모두 맞혔어요.'
        : correctCount >= Math.ceil(quizzes.length * 0.6)
          ? '잘했어요! 해설을 읽으면 더 오래 기억할 수 있어요.'
          : '괜찮아요. 정답과 해설을 보면서 한 번 더 배워 봐요.';

      const resultMascot = isPerfect
        ? RESULT_IMAGES[0]
        : correctCount >= Math.ceil(quizzes.length * 0.6) ? RESULT_IMAGES[1] : RESULT_IMAGES[2];
      document.getElementById('result-mascot').src = KKUL + resultMascot;

      document.getElementById('score-value').textContent = correctCount;
      document.getElementById('score-total').textContent = quizzes.length;
      document.getElementById('score-orb').setAttribute('aria-label', quizzes.length + '문제 중 ' + correctCount + '문제 정답');
      document.getElementById('score-display').textContent = quizzes.length + '문제 중 ' + correctCount + '문제를 맞혔어요';
      document.getElementById('score-message').textContent = scoreMessage;
      document.getElementById('score-progress-bar').style.width = (quizzes.length ? (correctCount / quizzes.length) * 100 : 0) + '%';
      document.getElementById('timer-text').innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"></circle><path d="M12 7v5l3 2"></path></svg><span>결과를 안전하게 저장하고 있어요.</span>';
      window.scrollTo({ top: 0, behavior: 'smooth' });
      if (isPerfect) dropConfetti();

      google.script.run
        .withSuccessHandler(function() { startCountdown(); })
        .withFailureHandler(function() { startCountdown(); })
        .saveQuizResult({
          userType: userType,
          userInfoText: userInfoText,
          scoreText: correctCount + ' / ' + quizzes.length,
          answersText: answersTextArr.join(', ')
        });
    }

    function startCountdown() {
      let timeLeft = 30;
      const timerNotice = document.getElementById('timer-text');
      updateTimer(timerNotice, timeLeft);
      if (countdownInterval) clearInterval(countdownInterval);
      if (autoResetTimer) clearTimeout(autoResetTimer);

      countdownInterval = setInterval(function() {
        timeLeft--;
        if (timeLeft > 0) {
          updateTimer(timerNotice, timeLeft);
        } else {
          clearInterval(countdownInterval);
        }
      }, 1000);

      autoResetTimer = setTimeout(function() { resetApp(); }, 30000);
    }

    function updateTimer(element, seconds) {
      element.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"></circle><path d="M12 7v5l3 2"></path></svg><span>' + seconds + '초 후 처음 화면으로 돌아갑니다.</span>';
    }

    function resetApp() {
      if (autoResetTimer) clearTimeout(autoResetTimer);
      if (countdownInterval) clearInterval(countdownInterval);
      if (advanceTimer) clearTimeout(advanceTimer);
      document.getElementById('class-num').value = '';
      document.getElementById('student-num').value = '';
      document.getElementById('staff-dept').value = '';
      document.getElementById('result-details').innerHTML = '';
      document.getElementById('result-screen').classList.add('hidden');
      document.getElementById('quiz-screen').classList.add('hidden');
      document.getElementById('user-screen').classList.remove('hidden');
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    function escapeHtml(value) {
      return String(value == null ? '' : value).replace(/[&<>"']/g, function(char) {
        return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[char];
      });
    }
  </script>
</body>
</html>
