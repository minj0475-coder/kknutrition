<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="robots" content="noindex, nofollow" />
<meta name="theme-color" content="#fbf7ec" />
<title>오늘의 급식 TV</title>
<link rel="manifest" href="manifest.json?v=6" />
<link rel="icon" type="image/png" sizes="192x192" href="assets/app-icon-192.png?v=6" />
<script>
  if (localStorage.getItem('kknutrition_portal_auth') !== 'true') {
    location.replace('index.html#today-menu');
  }
</script>
<script src="assets/data-guard.js?v=20260831_001"></script>
<script src="assets/allergy.js?v=20260828_002"></script>
<style>
  :root{
    --portal-font:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
    --bg:#fbf7ec;
    --card:#fffdf8;
    --green:#315d45;
    --green2:#8caf68;
    --orange:#f58a35;
    --sky:#87c8dc;
    --ink:#23372c;
    --muted:#6e7f74;
    --line:#dfe8dc;
    --shadow:0 12px 30px rgba(51,78,57,.10);
    --radius:28px;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;font-family:var(--portal-font);color:var(--ink);background:#e9eee7}
  button,input,textarea,select{font:inherit}
  button{cursor:pointer}

  /* 관리자 화면 */
  .app{display:grid;grid-template-columns:400px 1fr;height:100vh;min-height:100vh;overflow:hidden;background:#f4f4f5}
  .panel{
    height:100vh;padding:12px 20px 28px;background:#f8f8f8;border-right:1px solid #e5e5e7;overflow:auto;color:#202123
  }
  .panel-head{display:flex;align-items:center;justify-content:space-between;height:46px;gap:12px;margin:0 0 18px -10px}
  .panel-brand{display:flex;align-items:center;min-width:0;gap:10px}
  .panel-brand img{width:46px;height:46px;object-fit:contain;flex:none;filter:drop-shadow(0 5px 10px rgba(32,33,35,.08))}
  .panel-title-wrap{min-width:0}
  .panel h1{font-size:21px;line-height:1.2;margin:0;color:#202123;letter-spacing:-.035em}
  .back-link{
    display:inline-flex;align-items:center;justify-content:center;width:38px;height:38px;min-width:38px;padding:0;
    color:#56565d;background:transparent;border:0;border-radius:10px;
    text-decoration:none;box-shadow:none;transition:background .16s ease,color .16s ease,transform .16s ease
  }
  .back-link:hover{background:#ececef;color:#202123}
  .back-link:active{transform:scale(.96)}
  .back-link:focus-visible{outline:3px solid rgba(32,33,35,.14);outline-offset:2px}
  .back-link svg{width:18px;height:18px;display:block}
  .section{
    margin:0 0 12px;padding:16px;background:#fff;border:1px solid #e4e4e7;border-radius:16px;
    box-shadow:0 1px 3px rgba(32,33,35,.035)
  }
  .section h2{font-size:15px;margin:0 0 12px;color:#202123;letter-spacing:-.02em}
  .field{margin:11px 0}
  .field label{display:block;font-size:12px;font-weight:800;color:#62626a;margin-bottom:7px}
  input[type="text"],input[type="date"],textarea,select{
    width:100%;min-height:44px;padding:11px 12px;border:1px solid #dcdce1;border-radius:11px;
    background:#fff;color:#202123;outline:none;box-shadow:0 1px 2px rgba(32,33,35,.02)
  }
  input:focus,textarea:focus,select:focus{border-color:#8f8f98;box-shadow:0 0 0 3px rgba(32,33,35,.07)}
  textarea{min-height:74px;resize:vertical}
  input[type="checkbox"]{accent-color:#202123}
  .menu-row{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:7px;margin:10px 0;padding:9px;background:#fafafa;border:1px solid #ececef;border-radius:12px}
  .menu-row .menuInput{grid-column:1;grid-row:1}
  .menu-row .allergyInput{grid-column:1/-1;grid-row:2}
  .menu-row-actions{grid-column:2;grid-row:1;display:flex;gap:5px}
  .menu-row-actions .icon-btn{width:34px;min-width:34px;min-height:44px;padding:0;font-weight:900}
  .icon-btn{border:0;background:transparent;color:#606066;border-radius:9px;box-shadow:none}
  .icon-btn:hover{background:#ececef;color:#202123}
  .icon-btn:focus-visible{outline:3px solid rgba(32,33,35,.12);outline-offset:1px}
  .icon-btn:disabled{opacity:.32;cursor:default;background:transparent;color:#8d8d94}
  .btn{
    min-height:42px;border:1px solid #dedee2;border-radius:11px;padding:10px 14px;
    background:#fff;color:#202123;font-weight:850;box-shadow:0 1px 2px rgba(32,33,35,.04)
  }
  .btn:hover{border-color:#b8b8be;background:#f3f3f4}
  .btn.primary{background:#202123;color:#fff;border-color:#202123}
  .btn.primary:hover{background:#34343a;border-color:#34343a}
  .btn.secondary{background:#fff;color:#34343a}
  .btn.orange{background:#fff;color:#202123}
  .btn.full{width:100%;margin-top:8px}
  .checkline{display:flex;gap:8px;align-items:center;font-size:13px;font-weight:700;color:#4f4f55;margin:9px 0}
  .upload{
    border:1px dashed #c9c9cf;border-radius:13px;padding:13px;text-align:center;background:#fafafa
  }
  .upload input{width:100%}
  .upload input::file-selector-button{
    margin-right:9px;padding:8px 11px;border:1px solid #dedee2;border-radius:9px;background:#fff;color:#34343a;font-weight:800;cursor:pointer
  }
  .mini{font-size:11px;color:#85858d;line-height:1.55;margin-top:7px}
  .actions{position:sticky;bottom:-1px;padding:13px 0 2px;background:linear-gradient(transparent,#f8f8f8 18%)}

  /* 미리보기 영역 */
  .stage-wrap{display:flex;align-items:center;justify-content:center;height:100vh;padding:24px;min-width:0;background:#f1f1f2}
  .stage{
    width:min(100%, calc((100vh - 44px)*16/9));
    aspect-ratio:16/9;
    background:var(--bg);
    border-radius:22px;
    box-shadow:0 18px 55px rgba(37,60,44,.18);
    overflow:hidden;
    position:relative;
    container-type:inline-size;
  }
  .slide{
    position:absolute;inset:0;opacity:0;visibility:hidden;pointer-events:none;
    transition:opacity .55s ease, visibility .55s ease
  }
  .slide.active{opacity:1;visibility:visible;pointer-events:auto}

  /* 메인 TV 화면 - 55인치 TV 가독성 최적화 */
  .daily{
    height:100%;padding:2.6% 3.7% 2.9%;position:relative;overflow:hidden;
    background:linear-gradient(180deg,#fffefb 0%,#f8f6ef 100%);
  }
  .topline{display:flex;justify-content:center;align-items:center;min-height:4.2%;position:relative;z-index:2}
  .school-name{
    position:absolute;left:0;top:.05em;color:#405a4b;font-size:clamp(16px,1.28cqw,24px);
    font-weight:900;letter-spacing:-.025em
  }
  .date{
    padding:0;text-align:center;color:#52695c;font-size:clamp(19px,1.5cqw,28px);font-weight:900;letter-spacing:0
  }
  .title{
    text-align:center;font-weight:950;font-size:clamp(42px,4.65cqw,80px);line-height:1;
    margin:.45% 0 1.65%;letter-spacing:-.06em;color:var(--green)
  }
  .title span{color:var(--orange)}
  .main-grid{
    display:flex;
    gap:1.8%;height:72.4%;position:relative;z-index:2
  }
  .photo-card,.menu-card{
    background:#fff;
    border:1px solid #dfe7dd;
    border-radius:26px;
    box-shadow:0 10px 28px rgba(50,76,57,.08);
    overflow:hidden
  }
  .photo-card{
    position:relative;display:flex;align-items:center;justify-content:center;height:100%;width:auto;
    aspect-ratio:var(--photo-aspect,4/3);flex:0 1 auto;max-width:58%;background:#fff
  }
  .photo-card:after{
    content:"";position:absolute;inset:0;z-index:3;border-radius:26px;
    box-shadow:inset 0 0 0 1px rgba(255,255,255,.65);pointer-events:none
  }
  .photo-card > #photoPreview{
    width:100%;height:100%;object-fit:contain;display:none;background:#fff;
    transition:filter .2s ease,transform .2s ease
  }
  .photo-card.bright > #photoPreview{filter:brightness(1.06) contrast(1.025) saturate(1.035)}
  .photo-empty{text-align:center;color:#748578;padding:8%}
  .photo-empty-mascot{
    display:block;width:clamp(112px,12cqw,205px);height:auto;margin:0 auto 3%;
    filter:drop-shadow(0 12px 16px rgba(82,66,58,.12))
  }
  .photo-empty strong{font-size:clamp(22px,2.25cqw,39px);display:block;color:var(--green);letter-spacing:-.04em}
  .menu-card{
    position:relative;min-width:0;flex:1;padding:3.8% 4.7% 3.5%;display:flex;flex-direction:column;
    background:#fff
  }
  .menu-list{display:flex;flex:1;flex-direction:column;justify-content:center;gap:0}
  .menu-item{
    position:relative;display:flex;align-items:center;gap:15px;
    min-height:0;padding:.52em .15em;border:0;border-bottom:1px solid #e8ede8;border-radius:0;
    background:none;font-size:clamp(23px,2.25cqw,42px);font-weight:950;line-height:1.18;letter-spacing:-.045em;
    word-break:keep-all;box-shadow:none
  }
  .menu-item:last-child{border-bottom:0}
  .menu-item:before{content:"";width:10px;height:10px;border-radius:50%;background:var(--green2);flex:none}
  .menu-item:nth-child(3n+2):before{background:var(--sky)}
  .menu-item:nth-child(3n):before{background:var(--orange)}

  .menu-list.dense .menu-item{font-size:clamp(20px,1.9cqw,35px);padding:.4em .12em}
  .menu-list.very-dense .menu-item{font-size:clamp(18px,1.68cqw,30px);padding:.3em .1em}

  .menu-item .menu-name{flex:1;min-width:0}
  .menu-item .allergy{
    flex:none;display:inline-flex;align-items:center;justify-content:center;gap:.28em;max-width:49%;
    padding:.4em .68em;border-radius:10px;
    background:#fff1e7;color:#ad511d;border:0;
    font-size:clamp(20px,1.4cqw,27px);font-weight:950;line-height:1.14;letter-spacing:-.025em;white-space:normal;text-align:center
  }
  .menu-item .allergy:before{
    content:"알레르기";font-size:.72em;color:#a96b45;font-weight:900
  }
  .menu-list.dense .menu-item .allergy{font-size:clamp(17px,1.15cqw,22px)}
  .menu-list.very-dense .menu-item .allergy{font-size:clamp(16px,1.02cqw,20px)}






  .footer{
    position:absolute;left:50%;bottom:6.2%;transform:translateX(-50%);z-index:3;
    padding:0;background:none;border:0;box-shadow:none;
    font-size:clamp(16px,1.85cqw,34px);font-weight:950;line-height:1.2;color:var(--green);white-space:nowrap;
    text-shadow:0 2px 0 rgba(255,255,255,.96),0 0 14px rgba(255,255,255,.9)
  }
  .footer .accent{color:var(--orange)}
  .footer{max-width:88%;text-align:center;overflow:hidden;text-overflow:ellipsis}
  /* 특별 메뉴 화면 */
  .special{
    height:100%;padding:2.9% 4.5%;
    background:linear-gradient(180deg,#fffefb 0%,#f8f6ef 100%);
    position:relative
  }
  .special .special-title{
    text-align:center;font-size:clamp(38px,5cqw,82px);font-weight:950;line-height:1.05;letter-spacing:-.05em;color:var(--green);margin:.4% 0 .7%
  }
  .special .special-title span{color:var(--orange)}
  .special .kicker{text-align:center;color:#6d9561;font-weight:850;font-size:clamp(15px,1.5cqw,25px);margin-bottom:2%}
  .special-card{
    height:67%;border:1px solid #dfe7dd;border-radius:26px;background:#fff;
    box-shadow:0 10px 28px rgba(50,76,57,.08);display:grid;grid-template-columns:1.05fr .95fr;overflow:hidden
  }
  .special-copy{padding:6.5% 6%;display:flex;flex-direction:column;justify-content:center}
  .special-name{font-size:clamp(28px,3.55cqw,60px);font-weight:950;color:var(--green);letter-spacing:-.05em;line-height:1.1;margin-bottom:4%}
  .tags{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:5%}
  .tag{padding:.55em 1em;border-radius:999px;font-size:clamp(12px,1.25cqw,21px);font-weight:850;background:#eef5e8;color:var(--green);border:1px solid #bad099}
  .tag.orange{background:#fff2e8;color:#df6e1d;border-color:#f4af77}
  .special-desc{font-size:clamp(16px,1.6cqw,28px);font-weight:760;line-height:1.55;color:#355241;white-space:pre-line}
  .special-media{background:#f8fbf5;display:flex;align-items:center;justify-content:center;position:relative;overflow:hidden}
  .special-media img{width:100%;height:100%;object-fit:cover;display:none}
  .special-media .placeholder{font-size:clamp(68px,10cqw,145px)}
  .special-note{
    position:absolute;left:50%;bottom:4%;transform:translateX(-50%);
    color:#b65e20;font-weight:900;font-size:clamp(15px,1.5cqw,26px);white-space:nowrap
  }

  /* TV 모드 */
  body.tv .app{display:block}
  body.tv .panel{display:none}
  body.tv .stage-wrap{padding:0;width:100vw;height:100vh;background:#000;display:flex;align-items:center;justify-content:center}
  body.tv .stage{width:min(100vw,calc(100vh * 16 / 9));height:min(100vh,calc(100vw * 9 / 16));aspect-ratio:16/9;border-radius:0;box-shadow:none}
  body.tv{overflow:hidden;background:#000;cursor:none}
  .tv-hint{
    position:absolute;right:14px;bottom:12px;z-index:20;background:rgba(0,0,0,.55);color:#fff;
    padding:7px 10px;border-radius:9px;font-size:12px;opacity:0;transition:.2s;pointer-events:none
  }
  body.tv:hover .tv-hint{opacity:1}
  @media (max-width:900px){
    .app{grid-template-columns:1fr;height:auto;overflow:visible}
    .panel{height:auto;min-height:100vh;padding:10px 12px calc(84px + env(safe-area-inset-bottom));overflow:visible;border-right:none;border-bottom:1px solid #e5e5e7}
    .panel-head{height:48px;margin:0 0 12px -2px}
    .panel-brand{gap:9px}
    .panel-brand img{width:46px;height:46px}
    .panel h1{font-size:20px}
    .back-link{width:38px;height:38px;min-width:38px;border-radius:12px}
    .section{margin-bottom:10px;padding:14px;border-radius:15px}
    .section h2{margin-bottom:10px;font-size:15px}
    .field{margin:9px 0}
    .field label{margin-bottom:6px}
    input[type="text"],input[type="date"],textarea,select{min-height:44px;font-size:16px}
    .menu-row{grid-template-columns:minmax(0,1fr) auto;gap:7px;margin:9px 0;padding:8px}
    .menu-row .menuInput{grid-column:1;grid-row:1}
    .menu-row .allergyInput{grid-column:1/-1;grid-row:2}
    .menu-row-actions{grid-column:2;grid-row:1}
    .menu-row-actions .icon-btn{width:38px;min-width:38px;min-height:44px}
    .actions{
      position:fixed;left:0;right:0;bottom:0;z-index:40;display:grid;grid-template-columns:minmax(0,.72fr) minmax(0,1.28fr);gap:8px;
      padding:10px 12px max(10px,env(safe-area-inset-bottom));background:rgba(248,248,248,.94);border-top:1px solid rgba(222,222,226,.9);
      box-shadow:0 -10px 28px rgba(32,33,35,.08);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px)
    }
    .actions .btn{min-height:46px;margin:0}
    .stage .school-name{font-size:1.28cqw}
    .stage .date{font-size:1.5cqw}
    .stage .title{font-size:4.65cqw}
    .stage .photo-empty-mascot{width:12cqw}
    .stage .photo-empty strong{font-size:2.25cqw}
    .stage .menu-item{font-size:2.25cqw}
    .stage .menu-list.dense .menu-item{font-size:1.9cqw}
    .stage .menu-list.very-dense .menu-item{font-size:1.68cqw}
    .stage .menu-item .allergy{font-size:1.4cqw}
    .stage .menu-list.dense .menu-item .allergy{font-size:1.15cqw}
    .stage .menu-list.very-dense .menu-item .allergy{font-size:1.02cqw}
    .stage .footer{font-size:1.85cqw}
    .stage .special .special-title{font-size:5cqw}
    .stage .special .kicker{font-size:1.5cqw}
    .stage .special-name{font-size:3.55cqw}
    .stage .tag{font-size:1.25cqw}
    .stage .special-desc{font-size:1.6cqw}
    .stage .special-media .placeholder{font-size:10cqw}
    .stage .special-note{font-size:1.5cqw}
    .stage-wrap{height:auto;padding:12px 12px calc(87px + env(safe-area-inset-bottom))}
    .stage{border-radius:15px;box-shadow:0 12px 36px rgba(37,60,44,.14)}
  }
</style>
</head>
<body>
<div class="app">
  <aside class="panel">
    <div class="panel-head">
      <div class="panel-brand">
        <img src="assets/images/kkul-face-logo-small.png?v=1" alt="">
        <div class="panel-title-wrap">
          <h1>급식TV 관리자</h1>
        </div>
      </div>
      <a class="back-link" href="index.html#home" aria-label="꿀꿀포털 홈으로 가기" title="포털 홈">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 10.5 12 4l8 6.5v8a1.5 1.5 0 0 1-1.5 1.5h-13A1.5 1.5 0 0 1 4 18.5zM9 20v-6h6v6" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </a>
    </div>
    <div class="section">
      <h2>1. 기본 정보</h2>
      <div class="field">
        <label>날짜</label>
        <input id="dateInput" type="date">
      </div>
      <div class="field">
        <label>학교명</label>
        <input id="schoolNameInput" type="text" value="청수초등학교" placeholder="학교명">
      </div>
      <div class="mini">하단 영양·식생활 문구는 날짜에 따라 매일 자동으로 바뀝니다.</div>
    </div>

    <div class="section">
      <h2>2. 오늘의 식판사진</h2>
      <div class="upload">
        <input id="photoInput" type="file" accept="image/*">
      </div>
      <label class="checkline"><input id="brightToggle" type="checkbox" checked> 식판사진을 살짝 밝게 표시</label>
      <button class="btn secondary full" id="clearPhotoBtn">식판사진 지우기</button>
    </div>

    <div class="section">
      <h2>3. 메뉴</h2>
      <div id="menuInputs"></div>
      <button class="btn secondary full" id="addMenuBtn">+ 메뉴 추가</button>
    </div>

    <div class="section">
      <h2>4. 특별 메뉴 설명 페이지</h2>
      <label class="checkline"><input id="specialToggle" type="checkbox"> 특별 메뉴 페이지 사용</label>
      <div id="specialFields" style="display:none">
        <div class="field">
          <label>특별 메뉴명</label>
          <input id="specialName" type="text" placeholder="예: 제주고기국수">
        </div>
        <div class="field">
          <label>짧은 설명</label>
          <textarea id="specialDesc" placeholder="예: 제주에서 즐겨 먹는 돼지고기 국수예요!"></textarea>
        </div>
        <div class="field">
          <label>강조 문구 1</label>
          <input id="tag1" type="text" placeholder="예: 제주 향토음식">
        </div>
        <div class="field">
          <label>강조 문구 2</label>
          <input id="tag2" type="text" placeholder="예: 따뜻한 고기국수">
        </div>
        <div class="field">
          <label>하단 한마디</label>
          <input id="specialNoteInput" type="text" placeholder="예: 오늘도 맛있게!">
        </div>
        <div class="upload">
          <input id="specialPhotoInput" type="file" accept="image/*">
          <div class="mini">선택사항입니다. 없으면 오늘 식판사진을 사용합니다.</div>
        </div>
        <div class="field">
          <label>자동 전환 간격</label>
          <select id="intervalSelect">
            <option value="6000">6초</option>
            <option value="8000" selected>8초</option>
            <option value="10000">10초</option>
            <option value="12000">12초</option>
          </select>
        </div>
      </div>
    </div>

    <div class="actions">
      <button class="btn orange full" id="saveBtn">저장</button>
      <button class="btn primary full" id="tvBtn">TV 전체화면 보기</button>
    </div>
  </aside>

  <main class="stage-wrap">
    <div class="stage" id="stage">
      <section class="slide daily active" id="dailySlide">
        <div class="topline">
          <div class="school-name" id="schoolNameText">청수초등학교</div>
          <div class="date" id="dateText"></div>
        </div>
        <div class="title">오늘의 <span>급식</span></div>

        <div class="main-grid">
          <div class="photo-card" id="photoCard">
            <img id="photoPreview" alt="오늘의 식판사진">
            <div class="photo-empty" id="photoEmpty">
              <img class="photo-empty-mascot" src="assets/images/kkul-face-logo-small.png?v=1" alt="">

<script>
const $ = s => document.querySelector(s);
const menuWrap = $('#menuInputs');
const menuList = $('#menuList');
const state = {
  photo:null,
  specialPhoto:null,
  mediaExpiryTimer:null,
  timer:null,
  slide:0,
  menuSource:[],
  menuOverrides:{},
  savedMenuOrderDate:'',
  savedMenuOrder:[]
};

const TV_STORAGE_KEY = 'kkulkkoori_school_lunch_tv_v1';
const LEGACY_TV_STORAGE_KEY = 'schoolLunchTV';
const MENU_STORAGE_KEY = 'cookingMethodUploadedData_v5';
const MENU_DB_NAME = 'CookingMethodUploadDB';
const MENU_DB_STORE = 'payload';
const TV_MEDIA_DB_NAME = 'SchoolLunchTVMediaDB';
const TV_MEDIA_DB_STORE = 'dailyMedia';

function localDateKey(date=new Date()){
  return `${date.getFullYear()}-${String(date.getMonth()+1).padStart(2,'0')}-${String(date.getDate()).padStart(2,'0')}`;
}
function openTvMediaDB(){
  return new Promise((resolve,reject)=>{
    if(!window.indexedDB) return reject(new Error('IndexedDB unavailable'));
    const request=indexedDB.open(TV_MEDIA_DB_NAME,1);
    request.onerror=()=>reject(request.error);
    request.onupgradeneeded=()=>{
      if(!request.result.objectStoreNames.contains(TV_MEDIA_DB_STORE)) request.result.createObjectStore(TV_MEDIA_DB_STORE);
    };
    request.onsuccess=()=>resolve(request.result);
  });
}
async function readTvMediaRecord(key){
  try{
    const db=await openTvMediaDB();
    return await new Promise(resolve=>{
      const tx=db.transaction(TV_MEDIA_DB_STORE,'readonly');
      const request=tx.objectStore(TV_MEDIA_DB_STORE).get(key);
      request.onsuccess=()=>resolve(request.result||null);
      request.onerror=()=>resolve(null);
      tx.oncomplete=()=>db.close();
      tx.onabort=()=>db.close();
    });
  }catch(e){return null}
}
function readDailyMedia(){return readTvMediaRecord('today')}
async function writeTvMediaRecord(key,value){
  try{
    const db=await openTvMediaDB();
    await new Promise((resolve,reject)=>{
      const tx=db.transaction(TV_MEDIA_DB_STORE,'readwrite');
      const store=tx.objectStore(TV_MEDIA_DB_STORE);
      if(value==null) store.delete(key);
      else store.put(value,key);
      tx.oncomplete=()=>resolve();
      tx.onerror=()=>reject(tx.error);
      tx.onabort=()=>reject(tx.error);
    });
    db.close();
    return true;
  }catch(e){return false}
}
async function writeDailyMedia(date,photo,specialPhoto){
  if(date===localDateKey()&&(photo||specialPhoto)){
    return writeTvMediaRecord('today',{date,photo:photo||null,specialPhoto:specialPhoto||null,savedAt:Date.now()});
  }
  if(date===localDateKey()||!date) return writeTvMediaRecord('today',null);
  return true;
}

function menuRow(value='', allergy=''){
  const row = document.createElement('div');
  row.className='menu-row';
  row.innerHTML=`<input type="text" class="menuInput" value="${escapeHtml(value)}" placeholder="메뉴명">
                 <input type="text" class="allergyInput" value="${escapeHtml(allergy)}" placeholder="예: 대두, 밀">
                 <div class="menu-row-actions">
                   <button type="button" class="icon-btn move-up" title="위로 이동" aria-label="${escapeHtml(value||'메뉴')} 위로 이동">↑</button>
                   <button type="button" class="icon-btn move-down" title="아래로 이동" aria-label="${escapeHtml(value||'메뉴')} 아래로 이동">↓</button>
                   <button type="button" class="icon-btn delete-menu" title="삭제" aria-label="${escapeHtml(value||'메뉴')} 삭제">×</button>
                 </div>`;
  row.querySelector('.menuInput').addEventListener('input', render);
  row.querySelector('.allergyInput').addEventListener('input', render);
  row.querySelector('.move-up').addEventListener('click',()=>moveMenuRow(row,-1));
  row.querySelector('.move-down').addEventListener('click',()=>moveMenuRow(row,1));
  row.querySelector('.delete-menu').addEventListener('click',()=>{ row.remove(); render(); });
  menuWrap.appendChild(row);
}
function updateMenuOrderButtons(){
  const rows=[...menuWrap.querySelectorAll('.menu-row')];
  rows.forEach((row,index)=>{
    row.querySelector('.move-up').disabled=index===0;
    row.querySelector('.move-down').disabled=index===rows.length-1;
  });
}
function moveMenuRow(row,direction){
  if(direction<0){
    const previous=row.previousElementSibling;
    if(previous) menuWrap.insertBefore(row,previous);
  }else{
    const next=row.nextElementSibling;
    if(next) menuWrap.insertBefore(next,row);
  }
  render();
}
function escapeHtml(v=''){
  return String(v).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));
}

function parseMenuPayload(value, source=''){
  try{
    const parsed=typeof value==='string'?JSON.parse(value):value;
    const data=Array.isArray(parsed)?parsed:parsed?.data;
    if(!Array.isArray(data)||!data.length) return null;
    return {data,savedAt:Number(parsed?.savedAt||0),fileName:parsed?.fileName||'',source};
  }catch(e){return null}
}
function newerMenuPayload(current,candidate){
  if(!candidate) return current;
  if(!current||candidate.savedAt>current.savedAt) return candidate;
  return current;
}
function loadMenuFromIndexedDB(){
  return new Promise(resolve=>{
    if(!window.indexedDB) return resolve(null);
    const request=indexedDB.open(MENU_DB_NAME,1);
    request.onerror=()=>resolve(null);
    request.onupgradeneeded=()=>{
      if(!request.result.objectStoreNames.contains(MENU_DB_STORE)) request.result.createObjectStore(MENU_DB_STORE);
    };
    request.onsuccess=()=>{
      const db=request.result;
      const tx=db.transaction(MENU_DB_STORE,'readonly');
      const get=tx.objectStore(MENU_DB_STORE).get('latest');
      get.onsuccess=()=>{db.close();resolve(get.result||null)};
      get.onerror=()=>{db.close();resolve(null)};
    };
  });
}
async function loadMenuSource(){
  let latest=null;
  try{latest=newerMenuPayload(latest,parseMenuPayload(localStorage.getItem(MENU_STORAGE_KEY),'이 기기'))}catch(e){}
  latest=newerMenuPayload(latest,parseMenuPayload(await loadMenuFromIndexedDB(),'이 기기'));
  try{
    const response=await fetch('data/today-menu.json?v='+Date.now(),{cache:'no-store'});
    if(response.ok) latest=newerMenuPayload(latest,parseMenuPayload(await response.json(),'공용 식단'));
  }catch(e){}
  state.menuSource=latest?.data||[];
  return latest;
}
function splitMenuAndAllergy(rawName='',rawAllergy='',rawMaterials=''){
  let name=String(rawName).trim();
  let allergy=String(rawAllergy||'').trim();
  if(!allergy){
    const bracket=name.match(/[([]\s*((?:\d{1,2}\s*[.,/]\s*)*\d{1,2})\s*[)\]]\s*$/);
    const dotted=name.match(/((?:\d{1,2}\.){1,19})\s*$/);
    const match=bracket||dotted;
    if(match){
      allergy=(match[1].match(/\d{1,2}/g)||[]).join(',');
      name=name.slice(0,match.index).trim();
    }
  }
  if(!allergy&&window.KKNAllergy) allergy=window.KKNAllergy.inferFromIngredients(rawMaterials).join(', ');
  if(window.KKNAllergy) allergy=window.KKNAllergy.normalize(allergy);
  return {name,allergy};
}
function menuNameOf(item){
  return splitMenuAndAllergy(item?.name||item,item?.allergy||'',item?.materials||'').name;
}
function menuSortRank(item){
  const name=menuNameOf(item).replace(/[([][^)\]]*[)\]]/g,'').replace(/[\d.,/]+$/g,'').replace(/\s+/g,'');
  if(/밥|죽|덮밥|비빔밥|볶음밥|김밥|주먹밥|리조또/.test(name)) return 10;
  if(/(국|탕|찌개|전골|곰탕|설렁탕|육개장|스프|수제비|칼국수|우동|라면|쌀국수)$/.test(name)) return 20;
  if(/불고기|갈비|떡갈비|제육|돈가스|돈까스|커틀릿|치킨|닭|수육|보쌈|족발|스테이크|함박|생선|고등어|삼치|가자미|조기|연어|장어|오징어|낙지|주꾸미|새우|탕수육|강정|소시지|햄|미트볼|완자|두부|계란|달걀|만두|구이|튀김/.test(name)) return 30;
  if(/김치|깍두기|석박지|겉절이|동치미|총각|열무|오이소박이/.test(name)) return 50;
  if(/우유|요구르트|요거트|주스|음료|아이스크림|푸딩|젤리|케이크|쿠키|과일|사과|배$|귤|오렌지|바나나|포도|수박|참외|딸기|키위|파인애플|망고|멜론|꿀떡|백설기/.test(name)) return 60;
  return 40;
}
function autoSortMenuItems(items){
  return [...(items||[])].map((item,index)=>({item,index,rank:menuSortRank(item)}))
    .sort((a,b)=>a.rank-b.rank||a.index-b.index).map(entry=>entry.item);
}
function applySavedMenuOrder(items,dateKey){
  if(state.savedMenuOrderDate!==dateKey||!state.savedMenuOrder.length) return items;
  const positions=new Map(state.savedMenuOrder.map((name,index)=>[String(name).trim(),index]));
  return items.map((item,index)=>({item,index,position:positions.get(menuNameOf(item))}))
    .sort((a,b)=>(a.position??Number.MAX_SAFE_INTEGER)-(b.position??Number.MAX_SAFE_INTEGER)||a.index-b.index)
    .map(entry=>entry.item);
}
function replaceMenuRows(items){
  menuWrap.innerHTML='';
  const normalized=(items||[]).map(item=>splitMenuAndAllergy(item?.name||item,item?.allergy||'',item?.materials||''));
  (normalized.length?normalized:[{name:'',allergy:''}]).forEach(item=>menuRow(item.name,item.allergy));
  render();
}
function applyMenuForSelectedDate(clearWhenMissing=false){
  const key=$('#dateInput').value;
  if(Object.prototype.hasOwnProperty.call(state.menuOverrides,key)){
    replaceMenuRows(state.menuOverrides[key]);
    return true;
  }
  const section=state.menuSource.find(item=>item?.key===key);
  if(section?.items?.length){
    replaceMenuRows(applySavedMenuOrder(autoSortMenuItems(section.items),key));
    return true;
  }
  if(clearWhenMissing) replaceMenuRows([]);
  return false;
}
async function refreshMenuFromSource(clearWhenMissing=true){
  await loadMenuSource();
  applyMenuForSelectedDate(clearWhenMissing);
}
function fmtDate(v){
  const d=v?new Date(v+'T00:00:00'):new Date();
  const days=['일요일','월요일','화요일','수요일','목요일','금요일','토요일'];
  return `${d.getFullYear()}년 ${d.getMonth()+1}월 ${d.getDate()}일 ${days[d.getDay()]}`;
}
function readFile(input, cb){
  const f=input.files && input.files[0];
  if(!f) return;
  const r=new FileReader();
  r.onload=e=>{
    const img=new Image();
    img.onload=()=>{
      const maxSide=1600;
      let w=img.naturalWidth, h=img.naturalHeight;
      const scale=Math.min(1, maxSide/Math.max(w,h));
      w=Math.max(1,Math.round(w*scale));
      h=Math.max(1,Math.round(h*scale));
      const canvas=document.createElement('canvas');
      canvas.width=w; canvas.height=h;
      const ctx=canvas.getContext('2d');
      ctx.drawImage(img,0,0,w,h);
      let out;
      try{ out=canvas.toDataURL('image/jpeg',.82); }
      catch(err){ out=e.target.result; }
      cb(out);
    };
    img.onerror=()=>cb(e.target.result);
    img.src=e.target.result;
  };
  r.readAsDataURL(f);
}

const nutritionPhrases = [
  ['골고루 먹으면', '몸도 마음도 튼튼해져요!'],
  ['채소와 과일은', '우리 몸의 알록달록 에너지!'],
  ['한 입씩 천천히,', '꼭꼭 씹어 먹어요!'],

  ['오늘도 채소 한 입,', '건강 한 걸음!'],

  ['제철 음식에는', '계절의 맛이 담겨 있어요!'],
  ['편식보다 한 입 도전,', '새로운 맛을 만나봐요!'],
  ['천천히 먹으면', '음식 맛도 더 잘 느껴져요!'],
  ['좋은 식습관은', '매일의 작은 선택에서 시작해요!'],
  ['오늘의 한 끼가', '내일의 힘이 돼요!'],
  ['건강한 식사는', '즐겁게 먹는 것부터 시작해요!'],
  ['여러 가지 색의 식품을', '골고루 먹어봐요!'],
  ['밥도 반찬도 골고루,', '균형 있게 먹어요!'],
  ['먹기 전 손 씻기,', '건강한 식사의 첫걸음!'],
  ['음식을 소중히,', '먹을 만큼만 받아요!'],
  ['즐겁게 먹고,', '고마운 마음도 함께 나눠요!']
];

function dailyNutritionPhrase(dateValue){
  const base = dateValue || new Date().toISOString().slice(0,10);
  let hash = 0;
  for(let i=0;i<base.length;i++) hash = ((hash<<5)-hash) + base.charCodeAt(i);
  const idx = Math.abs(hash) % nutritionPhrases.length;
  return nutritionPhrases[idx];
}


function formatAllergy(raw=''){
  const value = raw.trim();
  if(!value) return '';
  return window.KKNAllergy ? window.KKNAllergy.normalize(value) : value;
}

function render(){
  updateMenuOrderButtons();
  const d=fmtDate($('#dateInput').value);
  $('#dateText').textContent=d;
  $('#specialDateText').textContent=d;

  const phrase = dailyNutritionPhrase($('#dateInput').value);
  $('#nutritionFooter').innerHTML = `<span>${escapeHtml(phrase[0])}</span> <span class="accent">${escapeHtml(phrase[1])}</span>`;

  const rows=[...document.querySelectorAll('.menu-row')].map(row=>({
    name:row.querySelector('.menuInput').value.trim(),
    allergy:row.querySelector('.allergyInput').value.trim()
  })).filter(x=>x.name);
  const menus=rows.map(x=>x.name);
  menuList.innerHTML='';
  menuList.className='menu-list';
  if(menus.length>=7 || menus.some(x=>x.length>=12)) menuList.classList.add('dense');
  if(menus.length>=9) menuList.classList.add('very-dense');
  rows.forEach(item=>{
    const div=document.createElement('div');
    div.className='menu-item';

    const name=document.createElement('span');
    name.className='menu-name';
    name.textContent=item.name;
    div.appendChild(name);

    const allergyText=formatAllergy(item.allergy);
    if(allergyText){
      const allergy=document.createElement('span');
      allergy.className='allergy';
      allergy.textContent=allergyText;
      div.appendChild(allergy);
    }

    menuList.appendChild(div);
  });

  $('#schoolNameText').textContent=$('#schoolNameInput').value.trim() || '우리 학교';
  $('#photoCard').classList.toggle('bright',$('#brightToggle').checked);

  const useSpecial=$('#specialToggle').checked;
  $('#specialFields').style.display=useSpecial?'block':'none';

  $('#specialNameText').textContent=$('#specialName').value.trim() || '특별 메뉴';
  $('#specialDescText').textContent=$('#specialDesc').value.trim() || '오늘의 특별 메뉴를 소개합니다.';
  $('#specialNoteText').textContent=$('#specialNoteInput').value.trim() || '오늘도 맛있게!';

  const tags=[$('#tag1').value.trim(),$('#tag2').value.trim()].filter(Boolean);
  $('#tagsBox').innerHTML='';
  tags.forEach((t,i)=>{
    const s=document.createElement('span');
    s.className='tag'+(i===1?' orange':'');
    s.textContent=t;
    $('#tagsBox').appendChild(s);
  });

  updateSpecialPhoto();
}
function showPhoto(img, empty, data){
  const isMainPhoto=img.id==='photoPreview';
  const card=isMainPhoto?$('#photoCard'):null;
  if(data){
    img.src=data; img.style.display='block'; empty.style.display='none';
    if(card){
      const applyAspect=()=>{
        if(!img.naturalWidth||!img.naturalHeight) return;
        const ratio=Math.min(1.55,Math.max(.78,img.naturalWidth/img.naturalHeight));
        card.style.setProperty('--photo-aspect',String(ratio));
      };
      if(img.complete) applyAspect();
      else img.addEventListener('load',applyAspect,{once:true});
    }
  }else{
    img.removeAttribute('src'); img.style.display='none'; empty.style.display='block';
    if(card) card.style.removeProperty('--photo-aspect');
  }
}
function updateSpecialPhoto(){
  const data=state.specialPhoto || state.photo;
  showPhoto($('#specialPhotoPreview'),$('#specialPlaceholder'),data);
}
function stopSlides(){
  clearInterval(state.timer); state.timer=null; state.slide=0;
  $('#dailySlide').classList.add('active');
  $('#specialSlide').classList.remove('active');
}
function startSlides(){
  stopSlides();
  if(!$('#specialToggle').checked) return;
  const interval=parseInt($('#intervalSelect').value,10)||8000;
  state.timer=setInterval(()=>{
    state.slide=1-state.slide;
    $('#dailySlide').classList.toggle('active',state.slide===0);
    $('#specialSlide').classList.toggle('active',state.slide===1);
  },interval);
}
async function save(){
  const savedMenus=[...document.querySelectorAll('.menu-row')].map(row=>({
    name:row.querySelector('.menuInput').value,
    allergy:row.querySelector('.allergyInput').value
  }));
  const date=$('#dateInput').value;
  const menuOverrides={...state.menuOverrides,[date]:savedMenus};
  const data={
    date,
    schoolName:$('#schoolNameInput').value,
    bright:$('#brightToggle').checked,
    menus:savedMenus,
    menuOverrides,
    menuOrder:savedMenus.map(item=>item.name.trim()).filter(Boolean),
    special:$('#specialToggle').checked,
    specialName:$('#specialName').value,
    specialDesc:$('#specialDesc').value,
    tag1:$('#tag1').value,
    tag2:$('#tag2').value,
    specialNote:$('#specialNoteInput').value,
    interval:$('#intervalSelect').value,
    savedAt:Date.now()
  };
  let localSaved=false;
  try{
    localStorage.setItem(TV_STORAGE_KEY,JSON.stringify(data));
    localSaved=true;
  }catch(e){}
  const databaseSaved=await writeTvMediaRecord('settings',data);
  if(!localSaved&&!databaseSaved){
    alert('설정 저장에 실패했습니다. 브라우저 저장공간을 확인한 뒤 다시 시도해 주세요.');
    return;
  }
  state.menuOverrides=menuOverrides;
  state.savedMenuOrderDate=data.date;
  state.savedMenuOrder=data.menuOrder;
  const mediaSaved=await writeDailyMedia(date,state.photo,state.specialPhoto);
  if(!mediaSaved){
    alert('설정은 저장했지만 사진 저장에 실패했습니다. 브라우저 저장공간을 확인해 주세요.');
    return;
  }
  $('#saveBtn').textContent='저장 완료 ✓';
  setTimeout(()=>$('#saveBtn').textContent='저장',1200);
}
function readLocalTvSettings(){
  let data=null;
  try{
    const saved=localStorage.getItem(TV_STORAGE_KEY)||localStorage.getItem(LEGACY_TV_STORAGE_KEY);
    data=JSON.parse(saved||'null');
    if(data&&!localStorage.getItem(TV_STORAGE_KEY)) localStorage.setItem(TV_STORAGE_KEY,JSON.stringify(data));
  }catch(e){}
  return data;
}
function newerTvSettings(localData,databaseData){
  if(!databaseData) return localData;
  if(!localData) return databaseData;
  return Number(databaseData.savedAt||0)>Number(localData.savedAt||0)?databaseData:localData;
}
function load(data=null){
  $('#dateInput').value=localDateKey();
  replaceMenuRows(data?.menus||[]);

  if(data){
    if(data.menuOverrides&&typeof data.menuOverrides==='object'&&!Array.isArray(data.menuOverrides)){
      state.menuOverrides=Object.fromEntries(Object.entries(data.menuOverrides).filter(([,menus])=>Array.isArray(menus)));
    }
    if(data.date&&Array.isArray(data.menus)&&!Object.prototype.hasOwnProperty.call(state.menuOverrides,data.date)){
      state.menuOverrides[data.date]=data.menus;
    }
    state.savedMenuOrderDate=data.date||'';
    state.savedMenuOrder=Array.isArray(data.menuOrder)?data.menuOrder:[];
    $('#schoolNameInput').value=data.schoolName||'청수초등학교';
    $('#brightToggle').checked=data.bright!==false;
    $('#specialToggle').checked=!!data.special;
    $('#specialName').value=data.specialName||'';
    $('#specialDesc').value=data.specialDesc||'';
    $('#tag1').value=data.tag1||'';
    $('#tag2').value=data.tag2||'';
    $('#specialNoteInput').value=data.specialNote||'';
    $('#intervalSelect').value=data.interval||'8000';
  }
  showPhoto($('#photoPreview'),$('#photoEmpty'),state.photo);
  render();
  return data;
}
async function loadDailyMedia(legacyData=null){
  const today=localDateKey();
  let media=await readDailyMedia();
  if(media&&media.date!==today){
    await writeDailyMedia('',null,null);
    media=null;
  }
  if($('#dateInput').value!==today){
    state.photo=null;
    state.specialPhoto=null;
  }else if(media){
    state.photo=media.photo||null;
    state.specialPhoto=media.specialPhoto||null;
  }else if(legacyData?.date===today&&(legacyData.photo||legacyData.specialPhoto)){
    state.photo=legacyData.photo||null;
    state.specialPhoto=legacyData.specialPhoto||null;
    await writeDailyMedia(today,state.photo,state.specialPhoto);
  }else{
    state.photo=null;
    state.specialPhoto=null;
  }
  showPhoto($('#photoPreview'),$('#photoEmpty'),state.photo);
  render();
}
function scheduleDailyMediaExpiry(){
  clearTimeout(state.mediaExpiryTimer);
  const now=new Date();
  const tomorrow=new Date(now.getFullYear(),now.getMonth(),now.getDate()+1);
  state.mediaExpiryTimer=setTimeout(async()=>{
    state.photo=null;
    state.specialPhoto=null;
    await writeDailyMedia('',null,null);
    showPhoto($('#photoPreview'),$('#photoEmpty'),null);
    render();
    scheduleDailyMediaExpiry();
  },tomorrow.getTime()-now.getTime()+1000);
}
$('#addMenuBtn').addEventListener('click',()=>{menuRow('','');render()});
$('#clearPhotoBtn').addEventListener('click',()=>{
  state.photo=null;
  $('#photoInput').value='';
  showPhoto($('#photoPreview'),$('#photoEmpty'),null);
  updateSpecialPhoto();
});
$('#photoInput').addEventListener('change',()=>readFile($('#photoInput'),data=>{
  state.photo=data;showPhoto($('#photoPreview'),$('#photoEmpty'),state.photo);updateSpecialPhoto();
}));
$('#specialPhotoInput').addEventListener('change',()=>readFile($('#specialPhotoInput'),data=>{
  state.specialPhoto=data;updateSpecialPhoto();
}));
['dateInput','schoolNameInput','brightToggle','specialToggle','specialName','specialDesc','tag1','tag2','specialNoteInput','intervalSelect'].forEach(id=>{
  $('#'+id).addEventListener(['specialToggle','brightToggle','intervalSelect'].includes(id)?'change':'input',render);
});
$('#dateInput').addEventListener('change',async()=>{
  applyMenuForSelectedDate(true);
  await loadDailyMedia();
});
$('#saveBtn').addEventListener('click',save);
async function enterTvMode(){
  render();startSlides();document.body.classList.add('tv');
  try{ history.replaceState(null,'','#tv'); }catch(e){}
  if(!document.fullscreenElement){
    try{ await document.documentElement.requestFullscreen?.(); }catch(e){}
  }
}
$('#tvBtn').addEventListener('click',enterTvMode);
document.addEventListener('fullscreenchange',()=>{
  if(!document.fullscreenElement && document.body.classList.contains('tv')){
    document.body.classList.remove('tv');stopSlides();
    try{ history.replaceState(null,'',location.pathname+location.search); }catch(e){}
  }
});
document.addEventListener('keydown',e=>{
  if(e.key==='F5'){
    e.preventDefault();
    enterTvMode();
    return;
  }
  if(e.key==='Escape'){document.body.classList.remove('tv');stopSlides();}
});
async function initialize(){
  const localData=readLocalTvSettings();
  const databaseData=await readTvMediaRecord('settings');
  const savedData=newerTvSettings(localData,databaseData);
  load(savedData);
  await loadDailyMedia(savedData);
  scheduleDailyMediaExpiry();
  await refreshMenuFromSource(false);
  if(location.hash==='#tv'){
    document.body.classList.add('tv');
    render();
    startSlides();
  }
}
initialize();
</script>
